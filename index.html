<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operación Diaria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1C1A17;
    --paper:#FAF7F2;
    --paper-2:#F2EDE4;
    --line:#DEDACF;
    --rust:#B5502E;
    --rust-dim:#E8D3C7;
    --moss:#52684A;
    --moss-dim:#DCE4D6;
    --amber:#C18A2E;
    --amber-dim:#F0E0BC;
    --muted:#8A8478;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{max-width:760px; margin:0 auto; padding:28px 20px 80px;}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:8px;}
  .brand{font-family:'Fraunces', serif; font-weight:600; font-size:28px; letter-spacing:-0.01em;}
  .brand sup{font-family:'Inter',sans-serif; font-weight:600; font-size:12px; color:var(--rust); vertical-align:super; margin-left:4px;}
  .date-now{font-size:13px; color:var(--muted); text-transform:capitalize;}

  .subline{font-size:13px; color:var(--muted); margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:20px;}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-bottom:20px;}
  .tab-btn{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
    background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px;
    padding:9px 18px; cursor:pointer; transition:all .15s;
  }
  .tab-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* Day nav */
  .daynav{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; gap:10px;
  }
  .daynav-mid{flex:1; text-align:center;}
  .daynav-date{font-family:'Fraunces',serif; font-weight:600; font-size:16px; text-transform:capitalize;}
  .daynav-sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .nav-arrow{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--white);
    cursor:pointer; font-size:16px; color:var(--ink); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background .15s;
  }
  .nav-arrow:hover{background:var(--paper-2);}
  .today-pill{
    font-size:11.5px; color:var(--rust); cursor:pointer; text-decoration:underline; flex-shrink:0;
    background:none; border:none; padding:4px;
  }

  .syncbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:28px; gap:12px; flex-wrap:wrap;
  }
  .sync-status{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px;}
  .dot-pulse{width:7px; height:7px; border-radius:50%; background:var(--moss); flex-shrink:0;}
  .dot-pulse.error{background:var(--rust);}
  .btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    background:var(--ink); color:var(--paper); border:none; border-radius:7px;
    padding:9px 16px; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{opacity:0.85;}

  .metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:32px;}
  .metric{background:var(--white); border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px;}
  .metric .num{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1;}
  .metric .lbl{font-size:11.5px; color:var(--muted); margin-top:4px; letter-spacing:0.01em;}
  .metric.in .num{color:var(--moss);}
  .metric.out .num{color:var(--rust);}
  .metric.clean .num{color:var(--amber);}

  .section{margin-bottom:30px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .section-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .section-count{font-size:12px; color:var(--muted);}

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:13px 15px; display:flex; align-items:center; gap:13px; margin-bottom:8px;
    transition:border-color .15s;
  }
  .card.done{opacity:0.45;}
  .card.done .card-name{text-decoration:line-through;}

  .tag{
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px;
  }
  .tag.in{background:var(--moss-dim); color:var(--moss);}
  .tag.out{background:var(--rust-dim); color:var(--rust);}

  .card-info{flex:1; min-width:0;}
  .card-name{font-size:14.5px; font-weight:600;}
  .card-sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .card-date{font-size:11.5px; color:var(--muted); flex-shrink:0; text-align:right;}

  .check{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
    background:transparent; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:transparent; font-size:13px; transition:all .15s;
  }
  .check:hover{border-color:var(--moss);}
  .check.checked{background:var(--moss); border-color:var(--moss); color:var(--white);}

  .empty-state{
    text-align:center; padding:36px 20px; color:var(--muted); font-size:13.5px;
    border:1px dashed var(--line); border-radius:10px;
  }

  .err-list{font-size:12px; color:var(--rust); margin-top:8px; line-height:1.6;}

  footer{text-align:center; font-size:11.5px; color:var(--muted); margin-top:40px;}

  /* Week view */
  .week-day-block{margin-bottom:22px;}
  .week-day-head{
    font-family:'Fraunces',serif; font-weight:600; font-size:15px;
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line);
    text-transform:capitalize;
  }
  .week-day-head .wd-count{font-family:'Inter',sans-serif; font-size:11.5px; color:var(--muted); font-weight:500;}
  .week-empty{font-size:12.5px; color:var(--muted); padding:6px 0 2px;}

  .week-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:28px;}

  @media (max-width:480px){
    .metrics{grid-template-columns:repeat(2,1fr);}
    .week-summary{grid-template-columns:repeat(3,1fr);}
    .brand{font-size:24px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header>
      <div class="brand">Operación Diaria</div>
    </header>
    <div class="subline">Cargando tu operación...</div>
  </div>
</div>

<script>
const DONE_KEY = 'airbnb_ops_done_v1';
const TZ = 'America/Mexico_City';

function loadDone(){
  try{ return JSON.parse(localStorage.getItem(DONE_KEY) || '{}'); }catch(e){ return {}; }
}
function saveDone(d){ localStorage.setItem(DONE_KEY, JSON.stringify(d)); }

// --- CDMX-aware date helpers ---
function todayCDMX(){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(new Date());
  const map = {};
  parts.forEach(p => map[p.type] = p.value);
  return `${map.year}-${map.month}-${map.day}`;
}

function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0,10);
}

function dateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 12));
  return dt.toLocaleDateString('es-MX', { timeZone:'UTC', weekday:'long', day:'numeric', month:'long' });
}
function shortLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 12));
  return dt.toLocaleDateString('es-MX', { timeZone:'UTC', weekday:'short', day:'numeric', month:'short' });
}

function weekDates(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  const dow = dt.getUTCDay();
  const offsetToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = addDays(dateStr, offsetToMonday);
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(monday, i));
  return days;
}

let state = {
  view: 'day',
  selectedDay: todayCDMX(),
  selectedWeekAnchor: todayCDMX()
};

function cardHTML(item, type, done, showDate){
  const isDone = !!done[item.id];
  const tagLabel = type === 'in' ? 'IN' : 'OUT';
  const subLabel = type === 'in' ? 'Atención al cliente' : 'Programar limpieza';
  return `
    <div class="card ${isDone?'done':''}" id="card-${item.id}">
      <div class="tag ${type}">${tagLabel}</div>
      <div class="card-info">
        <div class="card-name">${item.prop}${item.owner ? ' · ' + item.owner : ''}</div>
        <div class="card-sub">${subLabel}</div>
      </div>
      ${showDate ? `<div class="card-date">${shortLabel(item.date)}</div>` : ''}
      <button class="check ${isDone?'checked':''}" onclick="toggleDone('${item.id}')">✓</button>
    </div>
  `;
}

window.toggleDone = function(id){
  const done = loadDone();
  done[id] = !done[id];
  saveDone(done);
  renderCurrentView();
};

window.setView = function(v){
  state.view = v;
  renderCurrentView();
};

window.shiftDay = function(n){
  state.selectedDay = addDays(state.selectedDay, n);
  renderCurrentView();
};
window.goToday = function(){
  state.selectedDay = todayCDMX();
  renderCurrentView();
};
window.shiftWeek = function(n){
  state.selectedWeekAnchor = addDays(state.selectedWeekAnchor, n*7);
  renderCurrentView();
};
window.goThisWeek = function(){
  state.selectedWeekAnchor = todayCDMX();
  renderCurrentView();
};

function buildIndex(data){
  const byDate = {};
  const errors = [];
  function ensure(d){ if(!byDate[d]) byDate[d] = { in:[], out:[] }; return byDate[d]; }
  data.properties.forEach(p => {
    if(!p.ok){ errors.push(p.name); return; }
    p.events.forEach(ev => {
      ensure(ev.startDate).in.push({ prop:p.name, owner:p.owner, date:ev.startDate, id:p.name+'-in-'+ev.start });
      ensure(ev.endDate).out.push({ prop:p.name, owner:p.owner, date:ev.endDate, id:p.name+'-out-'+ev.end });
    });
  });
  return { byDate, errors };
}

function renderShell(){
  const today = todayCDMX();
  document.querySelector('.wrap')?.remove();
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  wrap.innerHTML = `
    <header>
      <div class="brand">Operación Diaria<sup id="propCount"></sup></div>
      <div class="date-now" id="nowLabel"></div>
    </header>
    <div class="subline" id="syncLine"></div>
    <div class="tabs">
      <button class="tab-btn ${state.view==='day'?'active':''}" onclick="setView('day')">Día</button>
      <button class="tab-btn ${state.view==='week'?'active':''}" onclick="setView('week')">Informe semanal</button>
    </div>
    <div id="content"></div>
    <footer>Hora de Ciudad de México · Se actualiza al refrescar la página</footer>
  `;
  document.getElementById('app').appendChild(wrap);
}

function renderDayView(idx){
  const done = loadDone();
  const d = state.selectedDay;
  const today = todayCDMX();
  const dayData = idx.byDate[d] || { in:[], out:[] };
  const allIn = dayData.in;
  const allOut = dayData.out;

  return `
    <div class="daynav">
      <button class="nav-arrow" onclick="shiftDay(-1)">‹</button>
      <div class="daynav-mid">
        <div class="daynav-date">${dateLabel(d)}</div>
        <div class="daynav-sub">${d === today ? 'Hoy' : ''}</div>
      </div>
      <button class="nav-arrow" onclick="shiftDay(1)">›</button>
      ${d !== today ? `<button class="today-pill" onclick="goToday()">Hoy</button>` : ''}
    </div>

    <div class="metrics">
      <div class="metric in"><div class="num">${allIn.length}</div><div class="lbl">Llegadas</div></div>
      <div class="metric out"><div class="num">${allOut.length}</div><div class="lbl">Salidas</div></div>
      <div class="metric clean"><div class="num">${allOut.filter(o=>!done[o.id]).length}</div><div class="lbl">Limpiezas pendientes</div></div>
      <div class="metric"><div class="num">${idx.errors.length}</div><div class="lbl">Errores de sync</div></div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Llegadas</div><div class="section-count">${allIn.length} ${allIn.length===1?'tarea':'tareas'}</div></div>
      ${allIn.length === 0 ? '<div class="empty-state">No hay llegadas programadas este día.</div>' : allIn.map(i=>cardHTML(i,'in',done,false)).join('')}
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Salidas y limpiezas</div><div class="section-count">${allOut.length} ${allOut.length===1?'tarea':'tareas'}</div></div>
      ${allOut.length === 0 ? '<div class="empty-state">No hay salidas programadas este día.</div>' : allOut.map(i=>cardHTML(i,'out',done,false)).join('')}
    </div>

    ${idx.errors.length > 0 ? `<div class="err-list">No se pudieron sincronizar: ${idx.errors.join(', ')}</div>` : ''}
  `;
}

function renderWeekView(idx){
  const done = loadDone();
  const days = weekDates(state.selectedWeekAnchor);
  const today = todayCDMX();
  const isCurrentWeek = days.includes(today);

  let totalIn = 0, totalOut = 0, totalCleanPending = 0;
  days.forEach(d => {
    const dd = idx.byDate[d] || { in:[], out:[] };
    totalIn += dd.in.length;
    totalOut += dd.out.length;
    totalCleanPending += dd.out.filter(o=>!done[o.id]).length;
  });

  const rangeLabel = `${shortLabel(days[0])} – ${shortLabel(days[6])}`;

  const dayBlocks = days.map(d => {
    const dd = idx.byDate[d] || { in:[], out:[] };
    const total = dd.in.length + dd.out.length;
    if(total === 0){
      return `
        <div class="week-day-block">
          <div class="week-day-head">${dateLabel(d)} <span class="wd-count">0 tareas</span></div>
          <div class="week-empty">Sin movimientos.</div>
        </div>
      `;
    }
    const items = [
      ...dd.in.map(i => cardHTML(i,'in',done,false)),
      ...dd.out.map(i => cardHTML(i,'out',done,false))
    ].join('');
    return `
      <div class="week-day-block">
        <div class="week-day-head">${dateLabel(d)} <span class="wd-count">${total} ${total===1?'tarea':'tareas'}</span></div>
        ${items}
      </div>
    `;
  }).join('');

  return `
    <div class="daynav">
      <button class="nav-arrow" onclick="shiftWeek(-1)">‹</button>
      <div class="daynav-mid">
        <div class="daynav-date">${rangeLabel}</div>
        <div class="daynav-sub">${isCurrentWeek ? 'Esta semana' : ''}</div>
      </div>
      <button class="nav-arrow" onclick="shiftWeek(1)">›</button>
      ${!isCurrentWeek ? `<button class="today-pill" onclick="goThisWeek()">Esta semana</button>` : ''}
    </div>

    <div class="week-summary">
      <div class="metric in"><div class="num">${totalIn}</div><div class="lbl">Llegadas en la semana</div></div>
      <div class="metric out"><div class="num">${totalOut}</div><div class="lbl">Salidas en la semana</div></div>
      <div class="metric clean"><div class="num">${totalCleanPending}</div><div class="lbl">Limpiezas pendientes</div></div>
    </div>

    ${dayBlocks}

    ${idx.errors.length > 0 ? `<div class="err-list">No se pudieron sincronizar: ${idx.errors.join(', ')}</div>` : ''}
  `;
}

function renderCurrentView(){
  if(!window.__lastData) return;
  renderShell();
  const idx = buildIndex(window.__lastData);
  const now = new Date();
  const nowLabel = now.toLocaleDateString('es-MX', { timeZone:TZ, weekday:'long', day:'numeric', month:'long' });
  document.getElementById('nowLabel').textContent = nowLabel;
  document.getElementById('propCount').textContent = window.__lastData.properties.length;
  const syncTime = new Date(window.__lastData.syncedAt).toLocaleTimeString('es-MX', { timeZone:TZ, hour:'2-digit', minute:'2-digit' });
  document.getElementById('syncLine').textContent = `Sincronizado a las ${syncTime} (CDMX) · ${window.__lastData.properties.length} propiedades conectadas`;

  document.getElementById('content').innerHTML = state.view === 'day' ? renderDayView(idx) : renderWeekView(idx);
}

function render(data){
  window.__lastData = data;
  renderCurrentView();
}

function renderError(msg){
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <header><div class="brand">Operación Diaria</div></header>
      <div class="empty-state" style="margin-top:20px;">No se pudo sincronizar: ${msg}<br><br>
      <button class="btn" onclick="location.reload()">Reintentar</button></div>
    </div>
  `;
}

fetch('/api/sync')
  .then(r => r.json())
  .then(data => {
    if(data.error) throw new Error(data.error);
    render(data);
  })
  .catch(e => renderError(e.message));
</script>
</body>
</html>
